name: Build rusEFI firmware (F407 Discovery)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake openjdk-11-jdk \
          gcc-arm-none-eabi binutils-arm-none-eabi mtools python3 python3-pip

    - name: Build firmware for F407 Discovery
      run: |
        cd firmware
        make BOARD=stm32f407-discovery

    - name: Generate TunerStudio INI
      run: |
        cd firmware
        make ini BOARD=stm32f407-discovery

 - name: Upload firmware and ini artifacts
  uses: actions/upload-artifact@v4
  with:
    name: rusefi-f407
    path: |
      firmware/build/*.bin
      firmware/tunerstudio/output/*.ini
      firmware/generated/*.ini
